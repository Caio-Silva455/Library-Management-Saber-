name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas da mesma branch quando chega um push novo
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI 1/3 — Frontend Angular: instala dependências e gera o build de produção
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Angular) - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build -- --configuration production

  # ---------------------------------------------------------------------------
  # CI 2/3 — Backend Node/Express: instala dependências e valida a sintaxe
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Node/Express) - instalação e checagem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checar sintaxe do server.js
        run: node --check server.js

  # ---------------------------------------------------------------------------
  # CI 3/3 — Docker Compose: sobe a stack inteira e faz um smoke test
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Compose - build e smoke test
    runs-on: ubuntu-latest
    env:
      # Valores descartáveis, usados só dentro do runner do CI
      DB_SA_PASSWORD: Ci_Passw0rd_2026
      DB_NAME: Biblioteca_Escola_Saber
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      # O "depends_on: service_healthy" faz o compose esperar o banco ficar saudável
      - name: Build e subida dos containers
        run: docker compose up -d --build

      - name: Smoke test - frontend responde na porta 8080
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            -o /dev/null http://localhost:8080/

      # O banco do CI está vazio (sem tabelas), então a rota deve falhar com
      # "Invalid object name". O que importa aqui é provar que o backend
      # conseguiu autenticar e falar com o SQL Server (sem "Login failed").
      - name: Smoke test - backend conecta no banco
        run: |
          code="000"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/resp.txt -w '%{http_code}' http://localhost:4000/estados || true)
            [ "$code" != "000" ] && break
            sleep 3
          done
          echo "HTTP $code"
          cat /tmp/resp.txt || true
          if [ "$code" = "000" ]; then
            echo "Backend não respondeu na porta 4000"; exit 1
          fi
          if grep -Eqi 'login failed|failed to connect|ECONNREFUSED|ETIMEOUT' /tmp/resp.txt; then
            echo "Backend não conseguiu conectar no banco"; exit 1
          fi

      - name: Logs dos containers (somente em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # CD — Publica as imagens no GitHub Container Registry (só em push na main)
  # ---------------------------------------------------------------------------
  publish:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O GHCR exige nome de imagem em minúsculas (o seu usuário tem maiúsculas)
      - name: Dono do repositório em minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push - backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/biblioteca-backend:latest
            ghcr.io/${{ env.OWNER }}/biblioteca-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build e push - frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/biblioteca-frontend:latest
            ghcr.io/${{ env.OWNER }}/biblioteca-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Resumo
        run: |
          {
            echo "### Imagens publicadas"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${OWNER}/biblioteca-backend:latest"
            echo "docker pull ghcr.io/${OWNER}/biblioteca-frontend:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"