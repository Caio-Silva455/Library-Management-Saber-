services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: biblioteca-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    networks:
      - biblioteca-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca-backend
    env_file:
      - .env
    environment:
      DB_SERVER: db
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: ${DB_SA_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - biblioteca-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - biblioteca-net

networks:
  biblioteca-net:
    driver: bridge

volumes:
  db-data: